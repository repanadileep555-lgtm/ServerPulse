[project]
name = "server-pulse-api"
version = "0.1.0"
description = "ServerPulse backend API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi[standard]>=0.162.2",
    "fastapi-offline>=1.7.7",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.0",
]

[project.scripts]
backend = "app.main:main"
create-admin = "app.cli.create_admin:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."
