<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121a33"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="pulse" x1="60" y1="0" x2="452" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Server units -->
  <g stroke="#2a3558" stroke-width="4">
    <rect x="124" y="120" width="264" height="80" rx="18" fill="#151c33"/>
    <rect x="124" y="222" width="264" height="80" rx="18" fill="#151c33"/>
    <rect x="124" y="324" width="264" height="80" rx="18" fill="#151c33"/>
  </g>

  <!-- Status LEDs -->
  <circle cx="352" cy="160" r="9" fill="#2dd4bf"/>
  <circle cx="352" cy="364" r="9" fill="#5b8cff"/>
  <!-- Vent lines -->
  <g stroke="#2a3558" stroke-width="6" stroke-linecap="round">
    <line x1="158" y1="150" x2="290" y2="150"/>
    <line x1="158" y1="174" x2="290" y2="174"/>
    <line x1="158" y1="354" x2="290" y2="354"/>
    <line x1="158" y1="378" x2="290" y2="378"/>
  </g>

  <!-- Heartbeat line -->
  <polyline points="60,262 160,262 186,226 214,298 244,222 272,262 452,262"
            fill="none" stroke="url(#pulse)" stroke-width="16"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
